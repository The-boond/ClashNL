name: Verify ClashNl platform cores

on:
  push:
    paths:
      - "Android/Core/**"
      - "Android/Examples/**"
      - "iOS/Core/**"
      - "iOS/Examples/**"
      - "iOS/scripts/verify-core.sh"
      - ".github/workflows/verify.yml"
  pull_request:
    paths:
      - "Android/Core/**"
      - "Android/Examples/**"
      - "iOS/Core/**"
      - "iOS/Examples/**"
      - "iOS/scripts/verify-core.sh"
      - ".github/workflows/verify.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-mihomo-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'
          cache-dependency-path: Android/Core/mihomo-bridge/native/go.sum
      - name: Verify Android Mihomo bridge
        working-directory: Android/Core/mihomo-bridge/native
        run: go test ./...

  ios-converter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Match the Go toolchain used by the pinned sing-box core ref.
          go-version: '1.25.12'
          cache-dependency-path: iOS/Core/clashconv/go.sum
      - name: Verify iOS converter and pinned core
        run: bash "iOS/scripts/verify-core.sh"
